<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-box">
    <h2 class="mb-4" align="center">Patient Registration</h2>

    <input type="text" id="firstName" required class="form-control mb-3" placeholder="First Name">

    <input type="text" id="lastName" required class="form-control mb-3" placeholder="Last Name">

    <input type="email" id="email" required class="form-control mb-3" placeholder="Email">

    <input type="password" id="password" required class="form-control mb-3" placeholder="Password">

    <input type="number" id="age" required class="form-control mb-3" placeholder="Age">

    <select id="gender" required class="form-control mb-3">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>


    <textarea id="medicalHistory" class="form-control mb-3" placeholder="Medical History"></textarea>

    <textarea id="existingCondition" class="form-control mb-3" placeholder="Existing Conditions"></textarea>

    <textarea id="allergies" class="form-control mb-3" placeholder="Allergies"></textarea>

    <textarea id="medication" class="form-control mb-3" placeholder="Current Medication"></textarea>

    <button class="btn btn-primary w-100" onclick="registerPatient()"> Register</button>

    <p id="message" align="center" class="mt-3"></p>
</div>

<script src="js/register.js"></script>

</body>
</html>
