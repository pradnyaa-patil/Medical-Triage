<!DOCTYPE html>
<html>

<head>

    <title>Medical Triage Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="container-fluid p-4">
    <P align="right">
    <button class="btn btn-danger" onclick="logout()"> Logout</button>
</p>

    <div class="row">

        <div class="col-12">

            <h2 class="text-center mb-4" align="center">
                AI Medical Triage Dashboard
            </h2>

        </div>

    </div>

    <div class="row mb-4">

        <div class="col">

            <a href="#"
               class="severity-link emergency"
               onclick="showSeverity('emergency')">

                EMERGENCY
                <span id="emergencyCount">(0)</span>

            </a>

        </div>

        <div class="col">

            <a href="#"
               class="severity-link urgent"
               onclick="showSeverity('urgent')">

                URGENT
                <span id="urgentCount">(0)</span>

            </a>

        </div>

        <div class="col">

            <a href="#"
               class="severity-link severe"
               onclick="showSeverity('severe')">

                SEVERE
                <span id="severeCount">(0)</span>

            </a>

        </div>

        <div class="col">

            <a href="#"
               class="severity-link medium"
               onclick="showSeverity('medium')">

                MEDIUM
                <span id="mediumCount">(0)</span>

            </a>

        </div>

        <div class="col">

            <a href="#"
               class="severity-link low"
               onclick="showSeverity('low')">

                LOW
                <span id="lowCount">(0)</span>

            </a>

        </div>

    </div>

    <div class="row">

        <div class="col-12">

            <div class="results-panel">

                <h4 id="selectedSeverity">
                    Select Severity
                </h4>

                <div id="patientList">

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/dashboard.js"></script>
<script src="js/logout.js"></script>

</body>

</html>
